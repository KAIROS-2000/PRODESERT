name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pro_dessert_test
          POSTGRES_USER: pro_dessert
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pro_dessert -d pro_dessert_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pro_dessert:test-only@localhost:5432/pro_dessert_test?schema=public
      REDIS_URL: redis://localhost:6379
      TOKEN_PEPPER: ci-only-token-pepper-at-least-32-characters
      SESSION_COOKIE_NAME: pro_dessert_session
      SESSION_TTL_SECONDS: 1800
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      ONE_C_ADAPTER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
